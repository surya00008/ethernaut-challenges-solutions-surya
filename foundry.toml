[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
# Commenting out strict solc version to allow auto-detection of older versions (e.g. 0.5.x, 0.6.x)
# solc_version = '0.8.20'

# Allow multiple Solidity versions for older challenges
# solc = '0.8.20'
evm_version = 'paris'

# Optimizer settings
optimizer = true
optimizer_runs = 200

remappings = [
    'forge-std/=lib/forge-std/src/',
    '@openzeppelin/=lib/openzeppelin-contracts/contracts/',
    'openzeppelin-contracts-06/=lib/openzeppelin-contracts-06/contracts/',
    'openzeppelin-contracts-08/=lib/openzeppelin-contracts-08/contracts/',
    'openzeppelin-contracts-v4.6.0/=lib/openzeppelin-contracts-v4.6.0/contracts/',
    'openzeppelin-contracts-v5.4.0/=lib/openzeppelin-contracts-v5.4.0/contracts/',
    'openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/',
    'openzeppelin/=lib/openzeppelin-contracts-08/contracts/'
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
